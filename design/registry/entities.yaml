# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: final_damage
    status: active
    source: design/gdd/health-damage.md
    referenced_by:
      - design/gdd/health-damage.md
      - design/gdd/spell-casting-effects.md  # SC&E feeds raw_damage as base_damage input via apply_damage()
      - design/gdd/status-effects.md  # Burn/Regen ticks call apply_damage/apply_heal into this pipeline
    variables:
      - base_damage      # float 0.0–unbounded; from enemy base_damage or spell base
      - damage_multiplier  # float 0.0–unbounded; always 1.0 since 2026-06-21 (elemental strong/weakness removed)
      - target_max_hp    # int 1–unbounded; per-target HP ceiling
    output_range: [0, target_max_hp]
    expression: "clamp(round(base_damage * damage_multiplier), 0, target_max_hp)"
    notes: "Core damage formula for all hits. damage_multiplier is always 1.0 — elemental strong/weakness (affiliation match) was removed 2026-06-21, so damage is element-neutral. DoT ticks also use element=null."
    added: 2026-05-23
    revised: ""

  - name: burn_total
    status: active
    source: design/gdd/prana-data.md
    referenced_by:
      - design/gdd/prana-data.md
      - design/gdd/status-effects.md  # Formula 1 — Burn Tick Damage uses burn_tick_magnitude and burn_duration
    variables:
      - base_damage
      - burn_tick_magnitude
      - burn_tick_count
    output_range: [0, unbounded]
    expression: "max(0, base_damage) * burn_tick_magnitude * burn_tick_count"
    notes: "burn_tick_magnitude=0.08, burn_tick_count=4 (2.0s/0.5s). max(0, base_damage) guard prevents healing DoT from negative inputs. Output feeds Health & Damage for DoT application."
    added: 2026-05-23
    revised: ""

  - name: regen_total
    status: active
    source: design/gdd/prana-data.md
    referenced_by:
      - design/gdd/prana-data.md
      - design/gdd/status-effects.md  # Formula 2 — Regen Tick Heal uses regen_tick_magnitude and fayde_max_hp
    variables:
      - fayde_max_hp
      - regen_tick_magnitude
      - regen_tick_count
    output_range: [0, unbounded]
    expression: "fayde_max_hp * regen_tick_magnitude * regen_tick_count"
    notes: "regen_tick_magnitude=0.02, regen_tick_count=3 (3.0s/1.0s). Output feeds Health & Damage for HP restoration."
    added: 2026-05-23
    revised: ""

  - name: effective_move_speed
    status: active
    source: design/gdd/enemy-data.md  # defined here; implemented by Status Effects GDD
    referenced_by:
      - design/gdd/enemy-data.md
      - design/gdd/enemy-ai.md  # MVP velocity expression; slow_pct = 0.0 at FP scope
      - design/gdd/status-effects.md  # Formula 3 reference; FREEZE sets slow_percentage = 0.50
    variables:
      - base_move_speed  # float px/s; from Enemy Data catalog
      - slow_percentage  # float 0.0–1.0; from Status Effects (Freeze = 0.50 per Prana Data)
    output_range: [0, base_move_speed]
    expression: "base_move_speed * max(0, 1 - slow_percentage)"
    notes: "Implemented by Status Effects (System #7). Enemy Data provides base_move_speed; Status Effects applies slow_percentage. max(0, ...) guard ensures speed cannot go negative."
    added: 2026-05-23
    revised: ""

