# Written by: /architecture-review 2026-05-29 (full mode)
# 105 requirements extracted from 14 GDDs

requirements:

  # ── Game State & Scene Flow ──────────────────────────────────────────────────
  - id: TR-GSF-001
    system: gsf
    gdd: design/gdd/game-state-scene-flow.md
    requirement: "GameStateManager is a Godot Autoload singleton — single active state machine, position 3 in AutoLoad order"
    created: "2026-05-29"
    revised: ""
    status: active

  - id: TR-GSF-002
    system: gsf
    gdd: design/gdd/game-state-scene-flow.md
    requirement: "Pause via get_tree().paused = true — gameplay nodes PROCESS_MODE_PAUSABLE, Autoloads PROCESS_MODE_ALWAYS (GSM, AudioSystem, CombatHUD)"
    created: "2026-05-29"
    revised: ""
    status: active

  - id: TR-GSF-003
    system: gsf
    gdd: design/gdd/game-state-scene-flow.md
    requirement: "await get_tree().process_frame between queue_free() and add_child() in SceneManager.change_room() — ensures freed scene is removed before new scene _ready() fires"
    created: "2026-05-29"
    revised: ""
    status: active

  - id: TR-GSF-004
    system: gsf
    gdd: design/gdd/game-state-scene-flow.md
    requirement: "Persistent HUD via CanvasLayer (layer 10) on permanent main.tscn root — never freed during room transitions"
    created: "2026-05-29"
    revised: ""
    status: active

  - id: TR-GSF-005
    system: gsf
    gdd: design/gdd/game-state-scene-flow.md
    requirement: "Re-entrancy guard on _request_transition() — second call during active transition rejected with push_error(); no recursive state changes"
    created: "2026-05-29"
    revised: ""
    status: active

  - id: TR-GSF-006
    system: gsf
    gdd: design/gdd/game-state-scene-flow.md
    requirement: "call_deferred() for boss_defeated → RUN_SUMMARY transition — allows same-frame player_died to take priority (death wins over simultaneous win)"
    created: "2026-05-29"
    revised: ""
    status: active

  - id: TR-GSF-007
    system: gsf
    gdd: design/gdd/game-state-scene-flow.md
    requirement: "preparation_started signal carries payload: wave_index: int, waves_remaining: int — consumed by WaveManager, CombatHUD"
    created: "2026-05-29"
    revised: ""
    status: active

  - id: TR-GSF-008
    system: gsf
    gdd: design/gdd/game-state-scene-flow.md
    requirement: "death_started is the first signal emitted in the COMBAT_PHASE → DEATH_SCREEN transition handler — before state change and run_ended"
    created: "2026-05-29"
    revised: ""
    status: active

  - id: TR-GSF-009
    system: gsf
    gdd: design/gdd/game-state-scene-flow.md
    requirement: "IsometricRoom: root Node2D with y_sort_enabled=true; TileMapLayer child with TILE_SHAPE_ISOMETRIC + tile_size Vector2i(64,32); EntityLayer Node2D with y_sort_enabled=true; get_spawn_markers() returns Array[Vector2] with >= 3 non-zero positions for WaveManager enemy placement; NOT an Autoload"
    created: "2026-05-31"
    revised: ""
    status: active

  # ── Prana Data ───────────────────────────────────────────────────────────────
  - id: TR-PD-001
