    created: "2026-05-29"
    revised: ""
    status: active

  - id: TR-PD-006
    system: pd
    gdd: design/gdd/prana-data.md
    requirement: "Burn tick constraint enforced by startup assert: burn_tick_magnitude × floor(burn_duration / burn_tick_rate) <= 0.60"
    created: "2026-05-29"
    revised: ""
    status: active

  - id: TR-PD-007
    system: pd
    gdd: design/gdd/prana-data.md
