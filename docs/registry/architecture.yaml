# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: forward_plus_for_isometric
    status: active
    description: "Do not switch to Forward+ or Mobile renderer solely to achieve isometric visuals. Compatibility renderer (OpenGL 3.3) fully supports TileMapLayer isometric mode and Y-sort."
    why: "Forward+ adds significant complexity and reduces hardware compatibility with no benefit for this 2D pixel art game. The isometric effect is a 2D rendering concern, not a 3D one."
    adr: docs/architecture/adr-0001-isometric-view.md
    added: 2026-05-26

  - pattern: autoload_access_in_init
    status: active
    description: "Do not access any Autoload singleton in _init(), in @export default value expressions, or in static initializers. Only access Autoloads from _ready(), signal handlers, or deferred calls."
    why: "_init() fires during node construction before Autoloads are added to the scene tree. @export defaults evaluate at editor parse time. Static initializers run at parse time. All three contexts precede Autoload availability."
    adr: docs/architecture/adr-0002-autoload-architecture.md
    added: 2026-05-29

  - pattern: extends_refcounted_for_autoloads
    status: active
    description: "Autoload scripts must extend Node (or a Node subclass), never RefCounted. Godot 4.6 rejects RefCounted-based scripts as AutoLoad registration targets."
    why: "RefCounted objects are not scene tree nodes and cannot receive _ready(), _process(), or signal connections. The engine will produce a registration error at startup. GameEnums intentionally uses extends RefCounted and is NOT an AutoLoad — this is the documented exception."
    adr: docs/architecture/adr-0002-autoload-architecture.md
    added: 2026-05-29

  - pattern: cross_system_state_polling
    status: active
    description: "No system may read state owned by another system inside _process() or _physics_process(). Reading another Autoload's properties on every frame is forbidden. React to signals instead."
    why: "Polling creates stale-by-one-frame reads, couples the reader to the owner's internal representation, and makes display systems impossible to test without live gameplay systems running."
    adr: docs/architecture/adr-0003-signal-driven-architecture.md
    added: 2026-05-29

  - pattern: circular_autoload_subscriptions
    status: active
    description: "If Autoload A connects to a signal on Autoload B in _ready(), then Autoload B must NOT connect to any signal on Autoload A. Circular subscriptions between Autoloads are forbidden."
    why: "Circular Autoload signal subscriptions create initialization order ambiguity — one of the two connections will silently fail depending on which _ready() runs first. ADR-0002 registration order prevents most cases; this rule closes the remainder."
    adr: docs/architecture/adr-0003-signal-driven-architecture.md
    added: 2026-05-29

  - pattern: dual_group_membership
    status: active
    description: "No scene node may be a member of both the 'player' group and the 'enemy' group simultaneously. PlayerController is the sole permitted member of 'player'. EnemyInstance scripts are the sole permitted members of 'enemy'."
    why: "H&D, SC&E, and EnemyAI all use is_in_group() to discriminate Fayde from enemies in signal handlers and Area2D callbacks. Dual membership would cause a node to trigger both code paths, resulting in self-damage or incorrect targeting."
    adr: docs/architecture/adr-0010-player-group-convention.md
    added: 2026-05-29

  - pattern: per_status_query_helpers
    status: active
    description: "Do not add per-status boolean helpers (is_frozen(), is_blinded(), is_stunned(), etc.) alongside or instead of has_status(). The unified has_status(target, status_type) is the sole status query interface."
    why: "Per-status helpers duplicate the query surface and don't scale — each new status type requires a new helper method. has_status() covers all current types (BURN, FREEZE, BLIND, STUN, REGEN, CHILL, STAGGER) and future types without code changes. architecture.md's original is_frozen()/is_blinded() spec is superseded by this ADR."
    adr: docs/architecture/adr-0011-status-effects-manager-api-contract.md
    added: 2026-05-29

  - pattern: direct_audiostreamplayer_instantiation
    status: active
    description: "No system outside AudioSystem may instantiate AudioStreamPlayer nodes directly (AudioStreamPlayer.new() or add_child(AudioStreamPlayer.new())). All audio must go through AudioSystem.play_event(), play_ambient(), or play_stinger()."
    why: "Direct instantiation bypasses the 4-bus architecture — nodes created outside AudioSystem are not routed to Music/SFX/UI/AMB buses, so player-facing volume sliders have no effect on them. This is the most common audio anti-pattern in Godot projects."
    adr: docs/architecture/adr-0012-audio-system-implementation-contract.md
    added: 2026-05-30

  - pattern: grab_focus_for_gamepad_cursor
    status: active
    description: "Do not use grab_focus() in any gamepad/joypad input handler to drive d-pad cursor selection. Any UI requiring a gamepad cursor must use _selected_slot_index: int + a repositioned overlay Control. grab_focus() may be called by the engine for keyboard Tab/arrow accessibility — that is intentional and permitted."
    why: "Godot 4.6 dual-focus system: grab_focus() affects keyboard/gamepad focus only (not mouse hover). Using it for a gamepad cursor conflates gamepad slot selection with keyboard accessibility focus — both share the same focus pool, making independent visual styling of 'gamepad cursor' vs. 'keyboard accessibility indicator' impossible. Confirmed HIGH RISK in architecture review QQ-02."
    adr: docs/architecture/adr-0013-prana-grid-dual-input-focus-model.md
    added: 2026-05-30

