#     referenced_by:
#       - docs/architecture/adr-0003-combat-system.md
#     added: 2026-03-26
#     revised: ""


# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: isometric_tilemap
    status: active
    api: TileMapLayer with TileSet.tile_shape = TileSet.TILE_SHAPE_ISOMETRIC
    not: TileMap (deprecated in 4.x); 3D environment nodes for isometric visual
    adr: docs/architecture/adr-0001-isometric-view.md
    reason: "TileMapLayer is the current API in Godot 4.x; isometric mode provides native tile sorting and rendering without Forward+ renderer. Projection: dimetric 2:1 (~26.57°), tile size 64x32px, sprite target 32-48px."
    referenced_by:
      - docs/architecture/adr-0001-isometric-view.md
    added: 2026-05-26
    revised: "2026-05-26"

  - purpose: depth_sorting
    status: active
    api: Node2D.y_sort_enabled = true on room root node
    not: manual z_index management per sprite
    adr: docs/architecture/adr-0001-isometric-view.md
    reason: "Engine-native Y-sort handles draw order automatically for all children; manual z_index is error-prone in isometric scenes"
    referenced_by:
      - docs/architecture/adr-0001-isometric-view.md
    added: 2026-05-26
    revised: ""

  - purpose: global_singleton_access
    status: active
    api: class_name lookup — e.g. PranaCatalog.get_type(), GameStateManager.get_active_state()
    not: get_node() path strings (e.g. get_node("/root/PranaCatalog")) — fragile on rename
    adr: docs/architecture/adr-0002-autoload-architecture.md
    reason: "class_name provides type-safe, zero-cost global access to Autoload singletons; get_node() paths break on rename and have runtime lookup overhead"
    referenced_by:
      - docs/architecture/adr-0002-autoload-architecture.md
    added: 2026-05-29
    revised: ""

  - purpose: player_node_lookup
    status: active
    api: SceneTree.get_first_node_in_group(&"player") — single-member lookup; short-circuits on first match
    not: get_node() path strings; direct node reference injection via WaveManager; Autoload-mediated registry
    adr: docs/architecture/adr-0010-player-group-convention.md
    reason: "get_first_node_in_group() is O(1) for the single-member 'player' group and allocates no array. group-based lookup decouples consumers from the PlayerController scene path. Already established by 3+ GDDs before this ADR."
    referenced_by:
      - docs/architecture/adr-0010-player-group-convention.md
      - docs/architecture/adr-0007-health-damage-autoload-singleton.md
    added: 2026-05-29
    revised: ""

  - purpose: group_query_return_type
    status: active
    api: "var enemies: Array = get_tree().get_nodes_in_group(&\"enemy\")  # untyped Array"
    not: "Array[Node] declaration — get_nodes_in_group() returns untyped Array in Godot 4.6; typed declaration causes runtime error"
    adr: docs/architecture/adr-0010-player-group-convention.md
    reason: "SceneTree.get_nodes_in_group() return type is Array (untyped) in Godot 4.x. Declaring the receiver as Array[Node] causes a runtime type error. Use untyped Array or explicit typed cast. All group-query consumers must also guard with is_instance_valid() — queue_free() nodes remain in groups until end-of-frame."
    referenced_by:
      - docs/architecture/adr-0010-player-group-convention.md
    added: 2026-05-29
    revised: ""

  - purpose: sfx_pool_implementation
    status: active
    api: "24 AudioStreamPlayer nodes pre-instantiated at _ready() in AudioSystem Autoload; pool slot timestamps via Time.get_ticks_msec()"
    not: "Scene-local AudioStreamPlayer nodes; OS.get_ticks_msec() (deprecated); get_playback_position() for age tracking (wraps on looping audio)"
    adr: docs/architecture/adr-0012-audio-system-implementation-contract.md
    reason: "Centralised Autoload pool enables priority eviction across all simultaneous callers. Time.get_ticks_msec() provides monotonic ticks unaffected by loop-point wrapping. 24 slots chosen for worst-case peak (≈20 simultaneous events) with 4 slots headroom."
    referenced_by:
      - docs/architecture/adr-0012-audio-system-implementation-contract.md
    added: 2026-05-30
    revised: ""

  - purpose: gamepad_cursor_implementation
    status: active
    api: "_selected_slot_index: int state variable + single repositioned Control overlay child (mouse_filter = MOUSE_FILTER_IGNORE); PranaGrid root must be plain Control (not Container subclass); initialize overlay position after await get_tree().process_frame"
    not: "grab_focus() for gamepad cursor tracking; Container subclass (GridContainer, VBoxContainer, etc.) as the PranaGrid root — layout algorithm silently overrides global_position assignments"
    adr: docs/architecture/adr-0013-prana-grid-dual-input-focus-model.md
    reason: "Godot 4.6 dual-focus system separates mouse hover from keyboard/gamepad focus. grab_focus() affects only keyboard/gamepad focus — using it for gamepad cursor conflates gamepad selection with keyboard accessibility focus (same focus pool), making independent visual styling impossible."
    referenced_by:
      - docs/architecture/adr-0013-prana-grid-dual-input-focus-model.md
    added: 2026-05-30
    revised: ""

