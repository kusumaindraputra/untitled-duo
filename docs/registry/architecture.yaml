# Architecture Decision Registry
#
# PURPOSE: Single source of truth for key architectural stances that all ADRs
# must agree on. Skills check this before writing new ADRs to detect conflicts
# at authoring time — before stories are created against contradictory decisions.
#
# RULES:
#   - Register a stance when it constrains how OTHER systems must be built.
#     An internal implementation detail that affects only one ADR does not need
#     to be registered.
#   - Never delete entries — set status: superseded_by: ADR-NNNN instead.
#   - When a stance changes: update the entry, set revised: to today's date,
#     add a comment with the old value, and run /architecture-review to check
#     what ADRs are now invalidated.
#   - adr: is the authoritative source. All other ADRs that depend on this
#     stance list themselves in referenced_by.
#
# WRITTEN BY: /architecture-decision (Phase 5 — after ADR is approved)
# READ BY:    /architecture-decision (Step 2 — before authoring begins)
#             /architecture-review (Phase 4 — cross-ADR conflict baseline)
#             /create-stories (to embed architectural constraints in stories)
#             /dev-story (to check implementation against accepted stances)
#
# SEARCH PATTERNS (for skills using Grep):
#   All state owners:       Grep pattern="^  - state:" path="docs/registry/architecture.yaml"
#   Who owns player_health: Grep pattern="state: player_health"
#   All signal contracts:   Grep pattern="pattern: signal"
#   Budget for combat:      Grep pattern="system: combat"
#   All forbidden patterns: Grep pattern="^  - pattern:" (forbidden_patterns section)
#   Superseded entries:     Grep pattern="status: superseded"

version: 1
last_updated: "2026-05-30"  # ADR-0013 added 2 stances

# ─── STATE OWNERSHIP ─────────────────────────────────────────────────────────
# Who is the authoritative owner of each piece of shared game state.
# Conflicts: two ADRs claiming to own the same state = data race / authority bug.
#
# Register state when it is READ or WRITTEN by more than one system.
# Internal-only state (never accessed by another system) does not need to be registered.
#
# Required fields: state, owner_system, adr, interface, referenced_by[], added
# interface: how other systems access this state (read-only property, method call,
#   signal, shared resource, etc.) — this is the contract other ADRs depend on.

state_ownership:
  - state: current_spell_effect
    status: active
    owner_system: SpellCastingEffects
    adr: docs/architecture/adr-0009-spell-casting-effects-stat-broker.md
    interface: "SpellCastingEffects.get_stat_bonus(stat_id: StringName) → float — read-only; returns 0.0 when no wave is active"
    write_access: SpellCastingEffects-only   # set on combo_resolved; cleared on preparation_started
    referenced_by:
      - docs/architecture/adr-0009-spell-casting-effects-stat-broker.md
      - docs/architecture/adr-0007-health-damage-autoload-singleton.md   # H&D calls get_stat_bonus at MVP
    added: 2026-05-29
    revised: ""

  - state: active_status_instances
    status: active
    owner_system: StatusEffectsManager
    adr: docs/architecture/adr-0011-status-effects-manager-api-contract.md
    interface: "apply_status() / has_status() / check_and_apply_shatter() — all write access internal to StatusEffectsManager"
    write_access: StatusEffectsManager-only   # set on apply_status; cleared on preparation_started and enemy_killed
    referenced_by:
      - docs/architecture/adr-0011-status-effects-manager-api-contract.md
      - docs/architecture/adr-0009-spell-casting-effects-stat-broker.md   # SC&E is sole apply_status and check_and_apply_shatter caller
    added: 2026-05-29
    revised: ""

  - state: music_state
    status: active
    owner_system: AudioSystem
    adr: docs/architecture/adr-0012-audio-system-implementation-contract.md
    interface: "Internal to AudioSystem — transitions driven by GameStateManager signals; no external read or write API exposed"
    write_access: AudioSystem-only   # transitions on run_started, combat_started, preparation_started, death_started, run_ended
    referenced_by:
      - docs/architecture/adr-0012-audio-system-implementation-contract.md
    added: 2026-05-30
    revised: ""

  - state: audio_event_registry
    status: active
    owner_system: AudioSystem
    adr: docs/architecture/adr-0012-audio-system-implementation-contract.md
    interface: "Loaded from res://assets/data/audio_event_registry.tres at startup; all play_event() / play_stinger() calls route through _validated_events (not the raw loaded dictionary)"
    write_access: AudioSystem-only   # populated by audio-director via .tres file; validated at startup
    referenced_by:
      - docs/architecture/adr-0012-audio-system-implementation-contract.md
    added: 2026-05-30
    revised: ""

# Example:
#
# state_ownership:
#   - state: player_health
#     status: active           # active | superseded_by: ADR-NNNN
#     owner_system: health-system
#     adr: docs/architecture/adr-0001-health-system.md
