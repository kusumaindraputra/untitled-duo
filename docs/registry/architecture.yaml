# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: stat_bonus_query
    status: active
    pattern: direct_call        # return-value required; signals are void-return (ADR-0003)
    producer: SpellCastingEffects
    consumers:
      - HealthAndDamage          # queries VER_HEAL_FLAT for heal/barrier scaling (MVP)
      - StatusEffectsManager     # queries duration and damage stat keys during DoT ticks (MVP)
    adr: docs/architecture/adr-0009-spell-casting-effects-stat-broker.md
    method_signature: "get_stat_bonus(stat_id: StringName) → float"
    return_semantics: "0.0 when no SpellEffect is cached (between waves); otherwise aggregate_stat_bonus.get(stat_id, 0.0)"
    referenced_by:
      - docs/architecture/adr-0009-spell-casting-effects-stat-broker.md
      - docs/architecture/adr-0007-health-damage-autoload-singleton.md
    added: 2026-05-29
    revised: ""

  - contract: status_application
    status: active
    pattern: direct_call
    producer: StatusEffectsManager
    consumers:
      - SpellCastingEffects     # sole caller of apply_status() at MVP scope
    adr: docs/architecture/adr-0011-status-effects-manager-api-contract.md
    method_signature: "apply_status(target: Node, status_type: GameEnums.BaseStatus, duration: float, spell_base_damage: float = 0.0) → void"
    return_semantics: "void; emits status_applied signal on successful application"
    referenced_by:
      - docs/architecture/adr-0011-status-effects-manager-api-contract.md
    added: 2026-05-29
    revised: ""

  - contract: shatter_query
    status: active
    pattern: direct_call        # return-value required; signals are void-return (ADR-0003)
    producer: StatusEffectsManager
    consumers:
      - SpellCastingEffects     # calls before every DIRECT apply_damage(); must not call has_status(FREEZE) directly
    adr: docs/architecture/adr-0011-status-effects-manager-api-contract.md
    method_signature: "check_and_apply_shatter(target: Node, base_damage: float) → float"
    return_semantics: "base_damage × 1.25 if FREEZE active; base_damage unchanged otherwise; Freeze not consumed"
    referenced_by:
      - docs/architecture/adr-0011-status-effects-manager-api-contract.md
    added: 2026-05-29
    revised: ""

  - contract: enemy_speed_control
    status: active
    pattern: direct_call
    producer: StatusEffectsManager
    consumers:
      - EnemyInstance           # MUST expose apply_speed_modifier(float) — called on Freeze/Chill apply and expiry
    adr: docs/architecture/adr-0011-status-effects-manager-api-contract.md
    method_signature: "apply_speed_modifier(multiplier: float) → void"
    return_semantics: "void; EnemyInstance stores _speed_multiplier and applies it in _physics_process()"
    referenced_by:
      - docs/architecture/adr-0011-status-effects-manager-api-contract.md
    added: 2026-05-29
    revised: ""

  - contract: enemy_stun_control
    status: active
    pattern: direct_call
    producer: StatusEffectsManager
    consumers:
      - EnemyInstance           # MUST expose apply_stun(float) — called on Stun and Stagger apply; self-terminating
    adr: docs/architecture/adr-0011-status-effects-manager-api-contract.md
    method_signature: "apply_stun(duration: float) → void"
    return_semantics: "void; self-terminating in EnemyInstance; SEM tracks StatusInstance for expiry signal only"
    referenced_by:
      - docs/architecture/adr-0011-status-effects-manager-api-contract.md
    added: 2026-05-29
    revised: ""

  - contract: sfx_dispatch
    status: active
    pattern: direct_call
    producer: AudioSystem
    consumers:
      - HealthAndDamage         # damage received, death audio
      - SpellCastingEffects     # Prana cast and impact audio; dynamic keys via StringName("sfx_prana_cast_" + name)
      - StatusEffectsManager    # status effect audio (future — not yet in MVP scope)
      - EnemyInstance           # enemy attack telegraphs
      - AllUISystems            # menu navigation and UI feedback (bus = &"UI" entries)
    adr: docs/architecture/adr-0012-audio-system-implementation-contract.md
    method_signature: "play_event(event_name: StringName) → void"
    return_semantics: "void; push_error() if event not registered or AMB-bus event; no-op with no crash"
    referenced_by:
      - docs/architecture/adr-0012-audio-system-implementation-contract.md
    added: 2026-05-30
    revised: ""

  - contract: volume_control
    status: active
    pattern: direct_call
    producer: AudioSystem
    consumers:
      - SaveLoad                # reads getters on save; calls setters on load for all 5 buses
    adr: docs/architecture/adr-0012-audio-system-implementation-contract.md
    method_signature: "set_*_volume(db: float) → void / get_*_volume() → float (Master, Music, SFX, UI, AMB)"
    return_semantics: "Setters clamp to −80.0–0.0 dB; Music max −3.0 dB; AMB max −10.0 dB. Getters read from AudioServer directly."
    referenced_by:
      - docs/architecture/adr-0012-audio-system-implementation-contract.md
    added: 2026-05-30
    revised: ""

  - contract: ambient_control
    status: active
    pattern: direct_call
    producer: AudioSystem
    consumers:
      - RoomLevelSystems        # call play_ambient() on room enter; stop_ambient() on room exit
    adr: docs/architecture/adr-0012-audio-system-implementation-contract.md
    method_signature: "play_ambient(event_name: StringName) → void; stop_ambient() → void"
    return_semantics: "void; A/B crossfade — no silence gap on play_ambient(); fade-out on stop_ambient()"
    referenced_by:
      - docs/architecture/adr-0012-audio-system-implementation-contract.md
    added: 2026-05-30
    revised: ""

  - contract: stinger_control
    status: active
    pattern: direct_call
    producer: AudioSystem
    consumers:
      - GameFeelJuice           # play_stinger("sfx_stinger_boss_spawn") on combat_started(is_boss:true)
      - LoreFragments           # play_stinger("sfx_stinger_memory_fragment") on memory reveal
    adr: docs/architecture/adr-0012-audio-system-implementation-contract.md
    method_signature: "play_stinger(event_name: StringName) → void; stop_stinger() → void"
    return_semantics: "void; ducks Music bus by AudioEventData.duck_depth_db for stinger duration; priority policy: NARRATIVE blocks COMBAT, NARRATIVE interrupted by NARRATIVE, same-priority last-caller-wins"
    referenced_by:
      - docs/architecture/adr-0012-audio-system-implementation-contract.md
    added: 2026-05-30
    revised: ""

